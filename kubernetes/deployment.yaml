apiVersion: apps/v1
kind: Deployment

metadata:
  name: platform-demo
  namespace: platform-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: platform-demo

  template:
    metadata:
      labels:
        app: platform-demo

    spec:
      containers:
        - name: platform-demo
          image: ghcr.io/arundinakaran/platform-demo:latest

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "128Mi"